# Mention @claude in an issue, a comment or a pull request review and Claude answers there, or makes the change on a
# branch. The workflow is Raineworks', in raine-works/agents (.github/workflows/claude.yml): this file only calls it, and comes
# from the raineworks-base skill's templates/workflows/claude.yml. Change the workflow there, for every repository at once;
# here, only its inputs (with:). The Base rules check moves the pin when the shared workflows change.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    name: Claude
    uses: raine-works/agents/.github/workflows/claude.yml@badd021c7a24f73f3b119255d3028abfd3863e2d # raine-works/agents master
    # The commands Claude may run: the checks in ci.yml (and regenerating their pinned requirements).
    with:
      allowed-commands: Bash(pip install -r requirements-test.txt),Bash(pip install -r apps/slate-agent/requirements-test.txt),Bash(pip install -r apps/slate-lightd/requirements-test.txt),Bash(pytest:*),Bash(python -m pytest:*),Bash(shellcheck:*),Bash(uv pip compile:*)
