[build-system]
# Scarthgap's python3-setuptools, as in slate-lightd (the image copies the agent's source, not a wheel).
requires = ["setuptools==69.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "slate-agent"
version = "0.1.0"
description = "HA Slate device agent: voice satellite, wake words and device control for Home Assistant"
license = {text = "MIT"}
requires-python = ">=3.12"
# The same pins as requirements-target.txt (the image's wheel set): change both together.
dependencies = [
    "websockets==12.0",
    "zeroconf==0.154.0",
    "pymicro-wakeword==2.5.0",
    "pyopen-wakeword==1.1.0",
]

[project.scripts]
slate-agent = "slate_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["slate_agent", "slate_agent.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
