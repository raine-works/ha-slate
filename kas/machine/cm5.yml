# Compute Module 5 (eMMC) + Raspberry Pi Touch Display 2, 10.1" (1200x1920,
# 4-lane DSI, 10-point touch) on the CM5 IO Board or a custom PoE carrier.
#   scripts/gen-dev-keys.sh
#   kas build kas/machine/cm5.yml
#   kas build kas/machine/cm5.yml --target slate-bundle    (RAUC update)
header:
  version: 14
  includes:
    - kas/slate.yml
    - kas/feature/rauc.yml

machine: raspberrypi-cm5-io-board

repos:
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    commit: 018d44467c4f09eb63f8ea5e86e85d755250cf89

local_conf_header:
  cm5: |
    # The 10.1" panel driver (ili79600a) exists from the 6.12 kernel on;
    # the BSP's default is 6.6.
    PREFERRED_VERSION_linux-raspberrypi = "6.12.%"
    # poky's U-Boot 2024.01 cannot boot BCM2712 (support landed in v2024.04).
    PREFERRED_VERSION_u-boot = "2026.10%"
    RPI_USE_U_BOOT = "1"
    ENABLE_UART = "1"
    ENABLE_SPI_BUS = "1"
    ENABLE_I2C = "1"
    DISABLE_SPLASH = "1"
    DISABLE_RPI_BOOT_LOGO = "1"
    # Compute Modules don't auto-detect Touch Display 2: load the overlay.
    # Default port is DSI1 (connector labelled 1); append ",dsi0" for port 0.
    # No "rotation=" here: the compositor rotates (SLATE_DISPLAY_TRANSFORM).
    RPI_EXTRA_CONFIG = "\n# HA Slate\ndtoverlay=vc4-kms-v3d\ndtoverlay=vc4-kms-dsi-ili79600-10-1inch\n"
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4"
    WKS_FILE = "slate-rpi-ab.wks.in"
    CMDLINE_ROOTFS = ""
    SLATE_RAUC_COMPATIBLE = "ha-slate-cm5"
    # The panel is natively portrait. Landscape wall mount: rotate-90 or
    # rotate-270 depending on which side the cable exits; portrait: normal.
    # Confirm the connector name on the device: ls /sys/class/drm
    SLATE_DISPLAY_OUTPUT = "DSI-1"
    SLATE_DISPLAY_TRANSFORM = "rotate-90"
