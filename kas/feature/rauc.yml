# A/B updates with RAUC. Requires keys: run scripts/gen-dev-keys.sh first.
header:
  version: 14

repos:
  meta-rauc:
    url: https://github.com/rauc/meta-rauc
    commit: d63878f20eba7a85ecf53566e7a3377e78bb46ac

local_conf_header:
  rauc: |
    DISTRO_FEATURES:append = " rauc"
    IMAGE_FSTYPES:append = " ext4"
    IMAGE_INSTALL:append = " kernel-image kernel-devicetree"
