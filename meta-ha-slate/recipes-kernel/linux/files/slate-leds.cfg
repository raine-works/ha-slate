# --- edge light bar ----------------------------------------------------------
# Option A: WS2812/SK6812 chain on SPI MOSI, driven from userspace via spidev.
CONFIG_SPI=y
CONFIG_SPI_SPIDEV=m
# Option B: RGB segments on an I2C constant-current driver (kernel LED class).
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_CLASS_MULTICOLOR=m
CONFIG_LEDS_LP50XX=m
CONFIG_LEDS_IS31FL32XX=m
CONFIG_LEDS_PCA963X=m
CONFIG_LEDS_PWM=m
CONFIG_LEDS_TRIGGERS=y
CONFIG_LEDS_TRIGGER_PATTERN=m
