# --- systemd hard requirements (read-only rootfs appliance) -----------------
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_BPF=y
CONFIG_MEMCG=y
CONFIG_FHANDLE=y
CONFIG_INOTIFY_USER=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
CONFIG_EPOLL=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_AUTOFS_FS=y
# --- storage: ext4 slots, /data, RAUC squashfs bundles ----------------------
CONFIG_EXT4_FS=y
CONFIG_OVERLAY_FS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_BLK_DEV_LOOP=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
# --- responsiveness: touch UI + audio capture on the same 4 cores ------------
CONFIG_PREEMPT=y
# --- watchdog (SoC driver is enabled in the BSP fragment) --------------------
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y
# --- networking: wired PoE only ---------------------------------------------
CONFIG_PACKET=y
CONFIG_IPV6=y
CONFIG_VLAN_8021Q=m
