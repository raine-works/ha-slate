# --- KMS display pipeline (SoC DRM driver comes from the BSP) ---------------
CONFIG_DRM=y
CONFIG_DRM_PANEL_SIMPLE=m
CONFIG_DRM_PANEL_ILITEK_ILI9881C=m
CONFIG_DRM_PANEL_JADARD_JD9365DA_H3=m
CONFIG_DRM_TOSHIBA_TC358762=m
CONFIG_DRM_TI_SN65DSI83=m
# Weston's DRM backend needs no fbdev; keep emulation for the boot console.
CONFIG_DRM_FBDEV_EMULATION=y
# weston.service has ConditionPathExists=/dev/tty0: VT support is required.
CONFIG_VT=y
# --- backlight ---------------------------------------------------------------
CONFIG_PWM=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_PWM=m
CONFIG_BACKLIGHT_GPIO=m
# --- touch -------------------------------------------------------------------
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_GOODIX=m
CONFIG_TOUCHSCREEN_EDT_FT5X06=m
CONFIG_TOUCHSCREEN_ILITEK=m
CONFIG_HID_MULTITOUCH=m
# Proximity / ambient light sensor for wake-on-approach & auto-brightness.
CONFIG_IIO=y
CONFIG_VCNL4000=m
CONFIG_LTR501=m
