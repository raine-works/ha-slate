# Acoustic echo cancellation so the wake word works while the panel speaks.
# Creates:  aec_mic  (cleaned capture source, used by the voice service)
#           aec_sink (playback sink; TTS + chimes MUST go here so the
#                     canceller has the reference signal)
# Bind capture/playback to the real nodes per hardware in the machine's
# bbappend (names from `pw-cli ls Node` on the target).
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name  = aec/libspa-aec-webrtc
      monitor.mode  = false
      aec.args = {
        webrtc.gain_control = true
        webrtc.noise_suppression = true
        webrtc.extended_filter = true
        webrtc.delay_agnostic = true
      }
      capture.props  = { node.name = "aec_capture" node.passive = true }
      source.props   = { node.name = "aec_mic"  node.description = "Echo-cancelled mic" }
      sink.props     = { node.name = "aec_sink" node.description = "Echo-cancelled speaker" }
      playback.props = { node.name = "aec_playback" node.passive = true }
    }
  }
]
