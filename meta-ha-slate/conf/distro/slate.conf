# HA Slate distro: systemd, Wayland-only, read-only rootfs appliance.
require conf/distro/poky.conf

DISTRO = "slate"
DISTRO_NAME = "HA Slate"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "slate-scarthgap"
MAINTAINER = "HA Slate maintainers"

SDK_VENDOR = "-slatesdk"
TARGET_VENDOR = "-slate"

# --- init & core features ---------------------------------------------------
INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " wayland opengl pam seccomp usrmerge zeroconf"
DISTRO_FEATURES:remove = "x11 3g nfc nfs nfs-client pcmcia ptest wifi-p2p sysvinit"
# Weston/Wayland without X: no Xwayland, no X11 fallbacks anywhere.
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " pulseaudio gobject-introspection-data"

# PipeWire is the only sound server (system instance, see slate-audio).
PREFERRED_PROVIDER_virtual/wpebackend = "wpebackend-fdo"

# mpv (used by the voice service for TTS/media) needs ffmpeg, which carries
# the "commercial" license flag because of patent-encumbered codecs. Review
# this with legal before shipping; restrict ffmpeg PACKAGECONFIG if needed.
LICENSE_FLAGS_ACCEPTED:append = " commercial"

# --- image hardening ----------------------------------------------------------
# Mutable state lives on /data (see slate-base); /etc gets a tmpfs overlay.
IMAGE_FEATURES:append = " read-only-rootfs"
# No package manager on target: updates are whole-image (RAUC).
IMAGE_FEATURES:remove = "package-management"

# Debug tweaks are only allowed in the -dev image (see slate-image-dev.bb).
EXTRA_IMAGE_FEATURES ?= ""

# --- reproducibility / compliance ---------------------------------------------
INHERIT += "create-spdx"
INHERIT += "buildhistory"
BUILDHISTORY_COMMIT = "1"
# Archive sources of everything copyleft we ship.
INHERIT += "archiver"
ARCHIVER_MODE[src] = "original"
COPYLEFT_LICENSE_INCLUDE = "GPL* LGPL* AGPL*"

# Python on target is the release's CPython; lva-wheels.inc is generated for it.
SLATE_PYTHON_ABI = "cp312"
