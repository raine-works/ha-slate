# meta-ha-slate: product layer for the HA Slate PoE touch panel.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ha-slate"
BBFILE_PATTERN_ha-slate = "^${LAYERDIR}/"
# Above BSP and community layers so our bbappends/config win.
BBFILE_PRIORITY_ha-slate = "20"

LAYERVERSION_ha-slate = "1"
LAYERDEPENDS_ha-slate = "core openembedded-layer meta-python multimedia-layer webkit"
LAYERSERIES_COMPAT_ha-slate = "scarthgap"

# RAUC / BSP recipes are only parsed when their layers are present.
BBFILES_DYNAMIC += " \
    rauc:${LAYERDIR}/dynamic-layers/rauc/*/*/*.bb \
    rauc:${LAYERDIR}/dynamic-layers/rauc/*/*/*.bbappend \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/*/*/*.bb \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/*/*/*.bbappend \
"

# Where wic finds our .wks files.
WKS_SEARCH_PATH:prepend = "${LAYERDIR}/wic:"

# Repository root (parent of this layer), resolved now while LAYERDIR is valid.
SLATE_REPO_DIR := "${@os.path.dirname('${LAYERDIR}')}"
# Update-signing material. Development default: keys/dev from
# scripts/gen-dev-keys.sh (gitignored). CI overrides with the release CA.
SLATE_KEYS_DIR ??= "${SLATE_REPO_DIR}/keys/dev"
