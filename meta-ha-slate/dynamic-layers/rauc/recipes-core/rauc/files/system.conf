[system]
compatible=@SLATE_RAUC_COMPATIBLE@
bootloader=uboot
statusfile=/data/rauc/central.raucs
bundle-formats=-plain
max-bundle-download-size=1073741824

[keyring]
path=/etc/rauc/slate-ca.cert.pem
use-bundle-signing-time=true

[handlers]
# Shows "updating" / "update installed" on the edge light bar.
pre-install=/usr/libexec/slate-rauc-hook pre-install
post-install=/usr/libexec/slate-rauc-hook post-install

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
