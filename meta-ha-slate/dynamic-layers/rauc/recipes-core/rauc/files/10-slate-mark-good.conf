# Only commit to a freshly-updated slot once the product actually works:
# the UI is up and the voice satellite is running. If either fails, the slot
# is never marked good and U-Boot falls back after BOOT_x_LEFT attempts
# (the hardware watchdog guarantees those reboots happen).
[Unit]
After=slate-kiosk.service slate-voice.service
Requires=slate-kiosk.service slate-voice.service

[Service]
ExecStartPre=/bin/sleep 60
ExecStartPre=/bin/systemctl is-active --quiet slate-kiosk.service slate-voice.service slate-lightd.service
