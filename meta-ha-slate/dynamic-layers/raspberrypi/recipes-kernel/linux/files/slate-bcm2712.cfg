# SoC drivers for BCM2712 + RP1 (Compute Module 5). All are enabled in the
# pinned kernel's bcm2712_defconfig (linux-raspberrypi 6.12.93); listed so a
# defconfig change cannot silently drop them.
# Display: vc4 KMS + v3d render
CONFIG_DRM_VC4=m
CONFIG_DRM_V3D=m
# Raspberry Pi Touch Display 2, 10.1" (1200x1920, 4-lane DSI, 10-point touch)
CONFIG_DRM_PANEL_ILITEK_IL79600A=m
CONFIG_TOUCHSCREEN_ILITEK_V3=m
CONFIG_REGULATOR_RASPBERRYPI_TOUCHSCREEN_V2=m
# RP1 I/O controller: Ethernet, SPI (edge bar), PWM, I2S
CONFIG_MFD_RP1=y
CONFIG_MACB=y
CONFIG_SPI_DW_MMIO=m
CONFIG_PWM_RP1=y
CONFIG_SND_DESIGNWARE_I2S=m
CONFIG_BCM2835_WDT=y
# The Pi 5 kernel uses 16K pages; every prebuilt library slate-agent ships is
# 64K-aligned (checked), so this is safe.
CONFIG_ARM64_16K_PAGES=y
