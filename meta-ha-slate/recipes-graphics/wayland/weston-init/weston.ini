# HA Slate: Weston as a single-application kiosk compositor.
[core]
# kiosk-shell: every top-level surface is made fullscreen, no panel, no
# launcher, no window decorations, no way for a user to reach a desktop.
shell=kiosk-shell.so
backend=drm-backend.so
require-input=false
# Weston blanks (DPMS off) after this many seconds with no input; a touch
# wakes it. 0 = never; Home Assistant can still dim via the backlight entity.
idle-time=0
# Start even if an output is late (deferred DSI/LVDS bridge probe) and
# hot-add it when it appears.
require-outputs=any

[shell]
background-color=0xff000000

# Per-board [output] (connector + rotation) is appended at build time from
# SLATE_DISPLAY_OUTPUT / SLATE_DISPLAY_TRANSFORM (see weston-init.bbappend).
